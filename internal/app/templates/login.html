{{define "login.html"}}{{template "head" .}}<main class="login-page"><form class="panel login-card" method="post" action="/admin/login"><a class="brand" href="/">{{.Settings.SiteTitle}}</a><h1>管理员登录</h1>{{if .Error}}<div class="alert">{{.Error}}</div>{{end}}<input type="hidden" name="csrf" value="{{.CSRF}}"><label>用户名<input name="username" autocomplete="username" required autofocus></label><label>密码<input type="password" name="password" autocomplete="current-password" required></label><button class="button full" type="submit">登录</button></form></main></body></html>{{end}}
