{{define "settings.html"}}{{template "head" .}}<div class="admin-layout" data-admin-layout>{{template "admin_sidebar" .}}<div class="admin-workspace">{{template "admin_topbar" .}}<main class="container admin-page narrow"><header class="page-title"><p class="eyebrow">全局配置</p><h1>网站设置</h1></header><form method="post" enctype="multipart/form-data" class="panel settings-form"><input type="hidden" name="csrf" value="{{.CSRF}}"><div class="two-cols"><label>网站名称<input name="site_title" value="{{.Settings.SiteTitle}}" required></label><label>作者<input name="author" value="{{.Settings.Author}}"></label></div><label>首页标语<input name="tagline" value="{{.Settings.Tagline}}"></label><label>网站描述<textarea name="description" rows="3">{{.Settings.Description}}</textarea></label><label>站点 URL<input type="url" name="site_url" value="{{.Settings.SiteURL}}" required></label><label>SEO 关键词<input name="seo_keywords" value="{{.Settings.SEOKeywords}}"></label><fieldset class="site-icon-setting"><legend>网站图标</legend><div class="site-icon-row">{{if .Settings.SiteIcon}}<img src="{{.Settings.SiteIcon}}" alt="当前网站图标" width="64" height="64">{{else}}<span class="site-icon-placeholder" aria-hidden="true">无</span>{{end}}<div><input type="file" name="site_icon" accept="image/png,image/jpeg,image/gif,image/webp"><small>支持 PNG、JPEG、GIF 或 WebP，建议使用正方形图片，最大 10 MB。</small>{{if .Settings.SiteIcon}}<label class="site-icon-remove"><input type="checkbox" name="remove_site_icon" value="1"> 移除当前图标</label>{{end}}</div></div></fieldset><div class="two-cols"><label>每页文章数<input type="number" min="1" max="100" name="posts_per_page" value="{{.Settings.PostsPerPage}}"></label><label>页脚文本<input name="footer_text" value="{{.Settings.FooterText}}"></label></div><button class="button" type="submit">保存设置</button></form></main></div>{{template "admin_overlay" .}}</div><script src="/static/app.js" defer></script></body></html>{{end}}
