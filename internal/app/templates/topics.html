{{define "topics.html"}}{{template "head" .}}{{template "public_nav" .}}<main class="container page topics-page"><header class="page-title topic-page-title"><p class="eyebrow">知识合集</p><h1>专题</h1><p>循着清晰的文档树，系统阅读一个主题。</p></header>{{if .Topics}}<div class="topic-grid">{{range .Topics}}<article class="topic-card"><a class="topic-card-cover" href="/topics/{{.Slug}}">{{if .CoverURL}}<img src="{{.CoverURL}}" alt="《{{.Name}}》专题封面" loading="lazy">{{else}}<span aria-hidden="true">{{.Name}}</span>{{end}}</a><div><h2><a href="/topics/{{.Slug}}">{{.Name}}</a></h2><p>{{.DocumentCount}} 篇文档</p></div></article>{{end}}</div>{{else}}<div class="empty panel">专题正在整理中。</div>{{end}}</main>{{template "public_footer" .}}{{end}}
